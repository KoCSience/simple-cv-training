[project]
name = "simple_cnn_training"
version = "0.0.1"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "av>=17.0.0",
    "comet-ml>=3.57.3",
    "datasets[vision]>=4.8.4",
    "hydra-core>=1.3.3",
    "imgaug>=0.4.0",
    "jupyter>=1.1.1",
    "kornia>=0.6.10",
    "lightning>=2.6.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=3.0.2",
    "pydantic>=2.12,<3",
    "pytorchvideo",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "transformers[torch]>=5.5.3",
    "webdataset>=1.0.2",
    "wheel>=0.46.3",
    "simple-cv-core",
    "simple-cv-vision",
]

[tool.uv.workspace]
members = ["packages/core", "packages/vision"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "args",
    "callback",
    "dataset",
    "logger",
    "model",
    "setup",
    "test/dataset",
    "test/model",
    "test/setup",
    "test/utils",
    "utils",
    "display_environment.py",
    "main.py",
    "train.py",
    "val.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"

[tool.ty.src]
include = [
    "config",
    "packages/core/src/simple_cv_core",
    "test/config",
    "test/doctor",
    "test/logging",
    "test/registry",
]
exclude = [
    ".venv",
    "log",
    "comet_logs",
    "tf_logs",
    "downloaded_data",
    "pretrained_models",
    "packages/core/src/simple_cv_core/runner",
    "packages/vision",
]

[tool.uv.sources]
simple-cv-core = { workspace = true }
simple-cv-vision = { workspace = true }
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
pytorchvideo = { git = "https://github.com/facebookresearch/pytorchvideo.git" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "ty>=0.0.55",
]
# ref: uv https://docs.astral.sh/uv/guides/integration/pytorch/#installing-pytorch
