[project]
name = "simple-cv-vision"
version = "0.1.0"
description = "Vision models and datasets for simple_cv_framework."
requires-python = ">=3.12"
dependencies = [
    "simple-cv-core",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
