[project]
name = "simple-cv-core"
version = "0.1.0"
description = "Core configuration, runner, registry, and diagnostics for simple_cv_framework."
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.3",
    "lightning>=2.6.1",
    "omegaconf>=2.3.0",
    "pydantic>=2.12,<3",
    "torch>=2.11.0",
]

[project.scripts]
scv = "simple_cv_core.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
