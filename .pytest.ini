[pytest]
; addopts = --ignore=./pretrained_models/ -v -s -ra ; --run-external-data
addopts = --ignore=./pretrained_models/ -v -s -ra --run-external-data
; 「--run-external-data」は、データセットなど重たいスキップされるテストも実行する
pythonpath = src
testpaths = test
markers =
    gpu: tests that require CUDA-capable GPU hardware
    external_data: tests that require local or NAS dataset paths
    slow: tests that are too expensive for the default quick check
